name: Android build

on:
  push:
    branches:
      - fix/drawer-icons-russian-translation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          if-no-files-found: error
          retention-days: 14
